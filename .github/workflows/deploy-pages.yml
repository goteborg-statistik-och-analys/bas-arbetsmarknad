name: Publicera BAS-rapport

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Uppdatera BAS-data"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hämta källkod
        uses: actions/checkout@v4

      - name: Förbered GitHub Pages
        uses: actions/configure-pages@v5

      - name: Ladda upp webbappen
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

      - name: Publicera
        id: deployment
        uses: actions/deploy-pages@v4
